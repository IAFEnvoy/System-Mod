plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("src/generated/**/.cache")
}

def testModSourceSet = sourceSets.create('testMod') {
    java.setSrcDirs(['src/test-mod/java'])
    resources.setSrcDirs(['src/test-mod/resources'])
}

testModSourceSet.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
testModSourceSet.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath

repositories {
    mavenCentral()
    maven { url = "https://cursemaven.com" }
    maven { url = "https://maven.sighs.cc/repository/maven-public/" }
    maven { url = 'https://maven.ftb.dev/releases' }
    // FTB Quests 1.21.1 pulls Architectury as a transitive dependency.
    maven { url = 'https://maven.architectury.dev' }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def testClientGameDirectory = project.findProperty('systemTestClientGameDirectory') ?: 'run-test-client'
def testClientUsername = project.findProperty('systemTestClientUsername')

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        testClient {
            client()
            gameDirectory = file(testClientGameDirectory)
            ideName = 'Test Client'
            systemProperty 'fml.debugLoading', 'true'
            if (testClientUsername) {
                programArgument '--username'
                programArgument testClientUsername
            }
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG

            taskBefore(tasks.named('classes'))
            taskBefore(tasks.named(testModSourceSet.classesTaskName))
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        "${mod_id}_test" {
            sourceSet(testModSourceSet)
        }
    }
}

// Keep the development server console usable from Gradle/IDE launches.
tasks.named('runServer').configure {
    standardInput = System.in
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "com.sighs:ApricityUI-neoforge-1.21.1:${apricityui_version}"
    // Formula expressions are evaluated by exp4j; it rides along in this jar so a dependent mod does not have to.
    implementation jarJar("net.objecthunter:exp4j:0.4.8")
    // Nullability annotations for the inlined sources; NeoForge already resolves this version transitively.
    compileOnly "org.jetbrains:annotations:24.1.0"

    // SVC for optional voice input support
    compileOnly "curse.maven:simple-voice-chat-416089:${voicechat_file_id}"
    localRuntime "curse.maven:simple-voice-chat-416089:${voicechat_file_id}"

    // FTB Quests
    compileOnly "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    compileOnly "dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}"
    compileOnly "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"

    runtimeOnly "dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}"
    runtimeOnly "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    runtimeOnly "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
}

// A jarJar'd library is shipped nested inside the release jar, but in a development run this mod is a pair of folders
// and FML only shows it those folders - the nested jar is never extracted, so exp4j used to be missing at runtime.
// Unpacking it next to the mod classes puts it in the mod's own roots; the jar below drops those copies again and
// keeps only the nested one.
tasks.named('processResources', ProcessResources) {
    from({ zipTree(configurations.jarJar.singleFile) }) {
        include 'net/objecthunter/**'
    }
}

tasks.named('jar', Jar) {
    exclude 'net/objecthunter/**'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            ftb_quests_version     : ftb_quests_version,
            apricityui_version     : apricityui_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Report every diagnostic in one run; javac stops at 100 by default, which hides the real migration surface.
    options.compilerArgs << '-Xmaxerrs' << '10000'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
