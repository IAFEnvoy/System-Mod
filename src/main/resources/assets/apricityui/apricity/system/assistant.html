<!DOCTYPE html>
<html><head><link rel="stylesheet" href="assistant.css"></head>
<body>
<div id="workspace">
    <div id="topbar"><div id="identity"><span id="brand"></span></div><span id="status"></span><button id="close"></button></div>
    <div id="layout">
        <div id="sidebar">
            <div id="sidebar_navigation"></div>
            <div id="privacy"><div id="privacy_heading"></div><div id="privacy_text"></div></div>
            <div class="sidebar_actions"><button id="history" class="small"></button><button id="forget" class="small"></button></div>
        </div>
        <div id="main">
            <div id="page_chat" class="toolbar"></div>
            <div id="page_items" class="toolbar"><input id="item_query" type="text" maxlength="128"><button id="item_search"></button></div>
            <div id="page_search" class="toolbar shop"><div class="shop_controls"><input id="web_query" type="text" maxlength="2000"><button id="web_search"></button></div><p id="web_search_note"></p></div>
            <div id="page_quests" class="toolbar"><button id="quest_refresh"></button><button id="quest_claimable"></button></div>
            <div id="page_signin" class="toolbar signin"><div><h2 id="signin_title"></h2><p id="signin_text"></p></div><button id="signin_action" class="primary"></button></div>
            <div id="page_shop" class="toolbar shop"><div class="shop_controls"><input id="shop_query" type="text" maxlength="128"><button id="shop_search"></button><button id="shop_refresh"></button></div><p id="shop_text"></p></div>
            <div id="page_lottery" class="toolbar shop"><div class="shop_controls"><input id="lottery_query" type="text" maxlength="128"><button id="lottery_search"></button><button id="lottery_refresh"></button></div><p id="lottery_text"></p></div>
            <div id="welcome"><div class="signal">◇</div><h1 id="welcome_title"></h1><p id="welcome_text"></p></div>
            <div id="conversation"></div>
            <div id="asr_status"></div>
            <div id="composer"><div id="message_box"><input id="message" type="text" maxlength="2000"></div><button id="asr_toggle"></button><button id="asr_cancel"></button><button id="send" class="primary"></button></div>
        </div>
    </div>
</div>
<div id="command_suggestions"></div>
</body></html>
