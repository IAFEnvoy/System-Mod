<!DOCTYPE html>
<html><head><link rel="stylesheet" href="assistant.css"></head>
<body class="full">
<div id="workspace">
    <div id="topbar"><div id="identity"><span id="brand"></span></div><span id="status"></span><div id="topbar_navigation"></div><button id="close"><translation>system.ui.close</translation></button></div>
    <div id="layout">
        <div id="sidebar">
            <div id="sidebar_navigation"></div>
            <div id="privacy"><div id="privacy_heading"><translation>system.ui.privacy_heading</translation></div><div id="privacy_text"><translation>system.ui.privacy_text</translation></div></div>
            <div class="sidebar_actions"><button id="history" class="small"><translation>system.ui.history</translation></button><button id="forget" class="small"><translation>system.ui.forget</translation></button></div>
        </div>
        <div id="main">
            <div id="welcome"><div class="signal">◇</div><h1 id="welcome_title"></h1><p id="welcome_text"></p></div>
            <div id="conversation"><div id="conversation_entries"></div></div>
            <div id="page_items" class="toolbar"><input id="item_query" type="text" maxlength="128"><button id="item_search"><translation>system.ui.item_search</translation></button></div>
            <div id="page_search" class="toolbar shop"><div class="shop_controls"><input id="web_query" type="text" maxlength="2000"><button id="web_search"><translation>system.ui.web_search</translation></button></div><p id="web_search_note"><translation>system.ui.web_search_note</translation></p></div>
            <div id="page_quests" class="toolbar shop"><div class="shop_controls"><button id="quest_refresh"><translation>system.ui.quest_refresh</translation></button><button id="quest_submittable"><translation>system.ui.quest_submittable</translation></button><button id="quest_claimable"><translation>system.ui.quest_claimable</translation></button></div><div class="shop_controls"><input id="quest_guide_query" type="text"><button id="quest_guide_search"><translation>system.ui.quest_guide_search</translation></button></div></div>
            <div id="page_signin" class="toolbar signin">
                <div class="signin_icon" aria-hidden="true">✓</div>
                <div class="signin_copy"><h2 id="signin_title"><translation>system.ui.signin_title</translation></h2><p id="signin_text"><translation>system.ui.signin_text</translation></p></div>
                <button id="signin_action" class="primary"><translation>system.ui.signin_action</translation></button>
            </div>
            <div id="page_shop" class="toolbar shop"><div class="shop_controls"><input id="shop_query" type="text" maxlength="128"><button id="shop_search"><translation>system.ui.shop_search</translation></button><button id="shop_refresh"><translation>system.ui.shop_refresh</translation></button></div><p id="shop_text"><translation>system.ui.shop_text</translation></p></div>
            <div id="page_lottery" class="toolbar shop"><div class="shop_controls"><input id="lottery_query" type="text" maxlength="128"><button id="lottery_search"><translation>system.ui.lottery_search</translation></button><button id="lottery_refresh"><translation>system.ui.lottery_refresh</translation></button></div><p id="lottery_text"><translation>system.ui.lottery_text</translation></p></div>
            <div id="asr_status"></div>
            <div id="ai_access_hint" class="card_context"></div>
            <div id="composer"><div id="chat_mode_selector"><button id="chat_mode_trigger" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="chat_mode_menu"><span id="chat_mode_label"></span><span class="chat_mode_arrow" aria-hidden="true">▾</span></button><div id="chat_mode_menu" role="menu"></div></div><div id="message_box"><input id="message" type="text" maxlength="2000"></div><button id="asr_toggle"></button><button id="asr_cancel"><translation>system.asr.ui.cancel</translation></button><button id="send" class="primary"></button></div>
        </div>
    </div>
</div>
<div id="command_suggestions"></div>
</body></html>
