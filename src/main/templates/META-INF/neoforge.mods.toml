license = "${mod_license}"

[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${mod_version}" #mandatory
displayName = "${mod_name}" #mandatory
authors = "IAFEnvoy"
description = '''
Server-side AI game assistant with various and extensible features.
'''

[[mixins]]
config = "${mod_id}.mixins.json"

#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]] #optional
modId = "neoforge" #mandatory
type = "required" #mandatory
versionRange = "[${neo_version},)" #mandatory
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "saturn"
type = "required"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "apricityui"
type = "required"
versionRange = "[1.2.6,)"
ordering = "AFTER"
side = "CLIENT"

# The FTB adapter is loaded only when this optional mod is present.
[[dependencies.${mod_id}]]
modId = "ftbquests"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

# SVC is an optional client microphone backend; it is never required on a server.
[[dependencies.${mod_id}]]
modId = "voicechat"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"
